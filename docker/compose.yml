# Start it with script/start.sh, which checks the prerequisites and sets the variables used here.
name: asset-risk

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: asset-risk:local
    init: true
    # The host user, because the mounted settings files are only readable by their owner.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      # Localhost only: the app has no login.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../.asset-risk.json:/config/.asset-risk.json:ro
      - ../vendor/geolocate/.geolocate.json:/config/.geolocate.json:ro
      - data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
