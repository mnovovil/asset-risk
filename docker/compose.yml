# Start it with script/start.sh, which checks the prerequisites and sets the variables used here.
name: asset-risk

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: asset-risk:local
    init: true
    # The host user, because the mounted settings files are only readable by their owner.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      # Localhost only: the app has no login.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../.asset-risk.json:/config/.asset-risk.json:ro
      - ../vendor/geolocate/.geolocate.json:/config/.geolocate.json:ro
      # Only the FEMA flood zone database itself, never its folder, which could hold settings or
      # Terraform state. With no database, start.sh mounts /dev/null and runs show the zones as
      # unavailable.
      - ${FLOOD_ZONES_FILE:-/dev/null}:/fema/flood-zones.duckdb:ro
      - data:/data
    environment:
      # Empty when flood_zones_db is null, which leaves the lookup off.
      FLOOD_ZONES_DB: ${FLOOD_ZONES_DB:-}
      # The analyst's model server is the ollama service below, whatever analyst_url says.
      ASSET_RISK_ANALYST_URL: http://ollama:11434
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The portfolio analyst's model server. It runs only with the analyst profile, which
  # script/start.sh turns on when analyst_enabled is true. It publishes no ports: Ollama has no
  # login, so only the app reaches it, over the stack's own network.
  ollama:
    image: ollama/ollama:0.40.14
    profiles: [analyst]
    init: true
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # One model and one request at a time: the machine this targets has about 8 GB of memory.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Unload the model after 5 idle minutes, to give its memory back to runs.
      OLLAMA_KEEP_ALIVE: 5m
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
  # The analyst's model weights, about 1.1 GB for deepseek-r1:1.5b, kept across restarts.
  ollama_models:
